apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "argocd-mcp.fullname" . }}
  labels:
    {{- include "argocd-mcp.labels" . | nindent 4 }}
data:
  config.yaml: |
    listenAddr: {{ .Values.config.listenAddr | quote }}
    metricsAddr: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}"off"{{ end }}
    logLevel: {{ .Values.config.logLevel | quote }}
    readOnly: {{ .Values.config.readOnly }}
    defaultInstance: {{ .Values.config.defaultInstance | quote }}
    instances:
    {{- if .Values.localInstance.enabled }}
      - name: {{ .Values.localInstance.name | quote }}
        inCluster: true
        namespace: {{ .Values.localInstance.namespace | quote }}
        {{- with .Values.localInstance.applicationNamespaces }}
        applicationNamespaces: {{ toJson . }}
        {{- end }}
        readOnly: {{ .Values.localInstance.readOnly }}
    {{- end }}
    {{- range .Values.remoteInstances }}
      - name: {{ .name | quote }}
        server: {{ .server | quote }}
        certificateAuthorityFile: /etc/amcp/instances/{{ .name }}/ca.crt
        tokenFile: /etc/amcp/instances/{{ .name }}/token
        namespace: {{ default "argocd" .namespace | quote }}
        {{- with .applicationNamespaces }}
        applicationNamespaces: {{ toJson . }}
        {{- end }}
        readOnly: {{ default false .readOnly }}
    {{- end }}
    {{- if .Values.auth.enabled }}
    auth:
      enabled: true
      static:
        enabled: {{ .Values.auth.static.enabled }}
        tokens:
        {{- range .Values.auth.static.tokens }}
          - name: {{ .name | quote }}
            tokenFile: /etc/amcp/auth/{{ .name }}/token
        {{- end }}
      oidc:
        enabled: {{ .Values.auth.oidc.enabled }}
        issuer: {{ .Values.auth.oidc.issuer | quote }}
        audience: {{ .Values.auth.oidc.audience | quote }}
        jwksUrl: {{ .Values.auth.oidc.jwksUrl | quote }}
        groupsClaim: {{ .Values.auth.oidc.groupsClaim | quote }}
        usernameClaim: {{ .Values.auth.oidc.usernameClaim | quote }}
        resourceMetadata: {{ .Values.auth.oidc.resourceMetadata }}
        requiredScopes: {{ toJson .Values.auth.oidc.requiredScopes }}
        requiredGroups: {{ toJson .Values.auth.oidc.requiredGroups }}
    {{- end }}
